name: Daily Macro Update

on:
  workflow_dispatch:
  schedule:
    # Cron is UTC. 23:00 UTC = 07:00 SGT (after the US close).
    - cron: "0 23 * * 0-5"
    # Second pass 13:00 UTC = 21:00 SGT to catch FRED series published late
    # (e.g. WTI, S&P). Upserts are idempotent, so re-runs are safe.
    - cron: "0 13 * * 1-5"

permissions:
  contents: write   # only used by the keepalive step

concurrency:
  group: macro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch market data and news
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python update.py

      - name: Refresh the website
        if: success()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS -X POST "$SITE_URL/api/revalidate" -H "x-revalidate-secret: $REVALIDATE_SECRET"
          else
            echo "SITE_URL/REVALIDATE_SECRET not set; site will refresh on its 30-min cycle."
          fi

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # On the 1st of each month, push an empty commit so the schedule keeps running.
      - name: Keepalive
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "23" ]; then
            git config user.name "macropulse-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
          fi
